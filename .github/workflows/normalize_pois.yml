name: Guardar Puntos de Interes Normalizados

on:
  push:
    paths:
      - "raw_data/poi.geojson"
      - "scripts/procesar_pois.py"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Normalize GeoJSON
        run: python scripts/procesar_pois.py

      - name: 🔄 Sincronizar repositorio antes de subir
        run: git pull origin main --rebase --autostash

      - name: 💾 Guardar y subir cambios (Commit & Push)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto: GeoJSON POIs Granada actualizado [skip ci]"
          file_pattern: "data/poi_final.geojson"