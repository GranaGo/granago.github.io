name: Procesar Datos sobre Granada

on:
  push:
    paths:
      - "raw_data/**"
      - "scripts/procesar_gtfs.py"
      - "scripts/procesar_radares.py"
      - "scripts/procesar_palabras.py"
      - "scripts/procesar_encadenadas.py"
  workflow_dispatch:

jobs:
  construir-datos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Descargar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: 📦 Instalar dependencias
        run: pip install pandas pypdf

      - name: ⚙️ Ejecutar script de conversión
        run: python scripts/procesar_gtfs.py

      - name: 📸 Procesar Radares PDF
        run: python scripts/procesar_radares.py

      - name: 📚 Procesar Diccionario Wordle
        run: python scripts/procesar_palabras.py

      - name: 🔗 Procesar Palabras Encadenadas
        run: python scripts/procesar_encadenadas.py

      - name: 🔄 Sincronizar repositorio antes de subir
        run: git pull origin main --rebase --autostash

      - name: 💾 Guardar y subir cambios (Commit & Push)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto: Nuevos horarios y rutas generados [skip ci]"
          file_pattern: "data/**"