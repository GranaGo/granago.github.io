name: Procesar Datos sobre Granada

on:
  push:
    paths:
      - "raw_data/**"
      - "scripts/**"
  workflow_dispatch:

jobs:
  construir-datos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Descargar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Instalar dependencias
        run: pip install pypdf

      - name: ⚙️ Ejecutar script de conversión de GTFS
        run: python scripts/procesar_gtfs.py

      - name: ⚙️ Ejecutar script de tiempos estimados
        run: python scripts/gtfs_tiempos_estimados.py

      - name: 📸 Procesar Radares PDF
        run: python scripts/procesar_radares.py

      - name: 📚 Procesar Diccionario Wordle
        run: python scripts/procesar_palabras.py

      - name: 🔗 Procesar Palabras Encadenadas
        run: python scripts/procesar_encadenadas.py

      - name: ⚙️ Procesar POIs
        run: python scripts/procesar_pois.py

      - name: 🔄 Sincronizar repositorio antes de subir
        run: git pull origin main --rebase --autostash

      - name: 💾 Guardar y subir cambios (Commit & Push)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto: Nuevos datos generados"
          file_pattern: "data/**"
